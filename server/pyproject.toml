[project]
name = "quest-training-server"
version = "0.1.0"
description = "Connection-scoped MNIST training server for the Meta Quest learning demo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "tensorflow-cpu==2.20.0",
    "pillow==11.3.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.15.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real Keras training on the official MNIST dataset"]

[tool.ruff]
target-version = "py312"
line-length = 100
