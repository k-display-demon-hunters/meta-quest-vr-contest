services:
  server:
    image: mnist-training-server:local
    build: .
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    ports:
      - "${SERVER_BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-8000}:8000"
    volumes:
      - mnist-data:/data
    init: true
    stop_grace_period: 15s

volumes:
  mnist-data:
